<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#525252"/>
      <stop offset="50%" style="stop-color:#404040"/>
      <stop offset="100%" style="stop-color:#262626"/>
    </linearGradient>
    <linearGradient id="apGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#737373"/>
      <stop offset="100%" style="stop-color:#525252"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- WiFi signal pattern background -->
  <g opacity="0.08" stroke="#404040" stroke-width="1">
    <path d="M 160,145 Q 140,125 160,105" fill="none"/>
    <path d="M 150,145 Q 120,115 150,85" fill="none"/>
    <path d="M 140,145 Q 100,105 140,65" fill="none"/>
  </g>
  
  <!-- QoE Metrics Box (top) -->
  <g transform="translate(100, 12)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="32" rx="4" fill="white" stroke="#d4d4d4" stroke-width="1"/>
    <text x="100" y="14" text-anchor="middle" fill="#262626" font-family="system-ui, sans-serif" font-size="10" font-weight="600">QoE Optimization</text>
    <text x="45" y="26" text-anchor="middle" fill="#800000" font-family="system-ui, sans-serif" font-size="9">Bitrate ↑</text>
    <text x="100" y="26" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9">Latency ↓</text>
    <text x="155" y="26" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="9">Stalling ↓</text>
  </g>
  
  <!-- Video Camera Source -->
  <g transform="translate(28, 105)" filter="url(#shadow)">
    <rect x="0" y="10" width="65" height="45" rx="4" fill="url(#cameraGrad)"/>
    <circle cx="50" cy="32" r="16" fill="#1a1a1a" stroke="#404040" stroke-width="1.5"/>
    <circle cx="50" cy="32" r="10" fill="#262626"/>
    <circle cx="50" cy="32" r="5" fill="#525252"/>
    <circle cx="47" cy="29" r="2" fill="white" opacity="0.4"/>
    <rect x="5" y="15" width="22" height="13" rx="2" fill="#1a1a1a"/>
    <circle cx="14" cy="45" r="4" fill="#800000"/>
    <text x="32" y="72" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9">Source</text>
  </g>
  
  <!-- Data flow arrow -->
  <g>
    <line x1="98" y1="135" x2="138" y2="135" stroke="#a3a3a3" stroke-width="1.5"/>
    <polygon points="138,135 132,131 132,139" fill="#a3a3a3"/>
  </g>
  
  <!-- WiFi Access Point (MU-MIMO) -->
  <g transform="translate(148, 105)" filter="url(#shadow)">
    <rect x="0" y="15" width="58" height="38" rx="6" fill="url(#apGrad)" stroke="#404040" stroke-width="1"/>
    <rect x="10" y="5" width="4" height="14" rx="2" fill="#a3a3a3"/>
    <rect x="27" y="0" width="4" height="19" rx="2" fill="#a3a3a3"/>
    <rect x="44" y="5" width="4" height="14" rx="2" fill="#a3a3a3"/>
    <circle cx="14" cy="28" r="3" fill="#800000"/>
    <circle cx="24" cy="28" r="3" fill="#800000"/>
    <circle cx="34" cy="28" r="3" fill="#737373"/>
    <circle cx="44" cy="28" r="3" fill="#737373"/>
    <text x="29" y="68" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9" font-weight="500">MU-MIMO</text>
  </g>
  
  <!-- MU-MIMO Beams (maroon accent) -->
  <polygon points="206,122 345,58 345,85" fill="#800000" opacity="0.08"/>
  <polygon points="206,135 345,125 345,152" fill="#404040" opacity="0.06"/>
  <polygon points="206,148 345,195 345,222" fill="#737373" opacity="0.06"/>
  
  <line x1="206" y1="122" x2="295" y2="72" stroke="#800000" stroke-width="1.5" opacity="0.5"/>
  <line x1="206" y1="135" x2="295" y2="138" stroke="#525252" stroke-width="1.5" opacity="0.4"/>
  <line x1="206" y1="148" x2="295" y2="208" stroke="#737373" stroke-width="1.5" opacity="0.4"/>
  
  <!-- User Devices -->
  <!-- User 1: Tablet -->
  <g transform="translate(295, 48)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="42" rx="4" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="4" y="4" width="52" height="30" rx="2" fill="#262626"/>
    <polygon points="22,18 35,24 22,30" fill="#800000" opacity="0.8"/>
    <circle cx="30" cy="38" r="2" fill="#a3a3a3"/>
    <text x="70" y="25" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User 1</text>
  </g>
  
  <!-- User 2: Laptop -->
  <g transform="translate(295, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="38" rx="3" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="4" y="4" width="52" height="26" rx="2" fill="#262626"/>
    <polygon points="22,16 33,22 22,28" fill="white" opacity="0.7"/>
    <rect x="-4" y="38" width="68" height="7" rx="1" fill="#737373"/>
    <text x="70" y="22" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User 2</text>
  </g>
  
  <!-- User 3: Phone -->
  <g transform="translate(305, 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="32" height="50" rx="4" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="3" y="6" width="26" height="35" rx="2" fill="#262626"/>
    <polygon points="11,22 20,26 11,30" fill="white" opacity="0.7"/>
    <circle cx="16" cy="45" r="3" fill="#a3a3a3"/>
    <text x="42" y="28" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User 3</text>
  </g>
  
  <!-- Label -->
  <text x="200" y="275" text-anchor="middle" fill="#525252" font-family="system-ui, -apple-system, sans-serif" font-size="11">MU-MIMO Video Streaming</text>
</svg>