<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e5e5"/>
      <stop offset="50%" style="stop-color:#a3a3a3"/>
      <stop offset="100%" style="stop-color:#737373"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#525252"/>
      <stop offset="100%" style="stop-color:#262626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#404040" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="350" y1="0" x2="350" y2="300"/>
  </g>
  
  <!-- 5G Tower -->
  <g transform="translate(55, 75)" filter="url(#shadow)">
    <polygon points="12,100 0,130 24,130" fill="#a3a3a3"/>
    <rect x="8" y="35" width="8" height="65" fill="#525252"/>
    <rect x="4" y="18" width="16" height="22" rx="2" fill="#404040"/>
    <rect x="10" y="0" width="4" height="22" fill="#737373"/>
    <!-- Signal waves -->
    <path d="M 28,25 Q 40,25 40,40" fill="none" stroke="#800000" stroke-width="1.5" opacity="0.6"/>
    <path d="M 32,20 Q 48,20 48,45" fill="none" stroke="#800000" stroke-width="1.5" opacity="0.4"/>
    <path d="M 36,15 Q 56,15 56,50" fill="none" stroke="#800000" stroke-width="1.5" opacity="0.25"/>
  </g>
  <text x="67" y="225" text-anchor="middle" fill="#525252" font-family="system-ui, -apple-system, sans-serif" font-size="10">5G/6G</text>
  
  <!-- Central Shield -->
  <g transform="translate(200, 145)" filter="url(#shadow)">
    <!-- Shield shadow -->
    <path d="M 0,-60 L -48,-38 L -48,22 L 0,60 L 48,22 L 48,-38 Z" fill="#d4d4d4" transform="translate(3, 3)"/>
    <!-- Shield main -->
    <path d="M 0,-60 L -48,-38 L -48,22 L 0,60 L 48,22 L 48,-38 Z" fill="url(#shieldGrad)" stroke="#525252" stroke-width="1"/>
    <!-- Shield highlight -->
    <path d="M 0,-50 L -38,-32 L -38,16 L 0,48 L 38,16 L 38,-32 Z" fill="white" opacity="0.3"/>
    <!-- Lock body -->
    <rect x="-15" y="-8" width="30" height="30" rx="4" fill="url(#lockGrad)"/>
    <!-- Lock shackle -->
    <path d="M -8,-8 L -8,-20 Q -8,-32 0,-32 Q 8,-32 8,-20 L 8,-8" fill="none" stroke="#404040" stroke-width="5"/>
    <path d="M -6,-8 L -6,-20 Q -6,-28 0,-28 Q 6,-28 6,-20 L 6,-8" fill="none" stroke="#737373" stroke-width="2.5"/>
    <!-- Keyhole (maroon accent) -->
    <circle cx="0" cy="6" r="5" fill="#800000"/>
    <rect x="-2.5" y="6" width="5" height="10" fill="#800000"/>
  </g>
  
  <!-- Protected Users -->
  <g transform="translate(300, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="32" rx="4" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="4" y="4" width="37" height="18" rx="2" fill="#262626"/>
    <circle cx="22" cy="27" r="2" fill="#a3a3a3"/>
    <text x="55" y="18" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User A</text>
  </g>
  
  <g transform="translate(308, 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="32" rx="4" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="4" y="4" width="37" height="18" rx="2" fill="#262626"/>
    <circle cx="22" cy="27" r="2" fill="#a3a3a3"/>
    <text x="55" y="18" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User B</text>
  </g>
  
  <g transform="translate(300, 185)" filter="url(#shadow)">
    <rect x="0" y="0" width="45" height="32" rx="4" fill="white" stroke="#404040" stroke-width="1.5"/>
    <rect x="4" y="4" width="37" height="18" rx="2" fill="#262626"/>
    <circle cx="22" cy="27" r="2" fill="#a3a3a3"/>
    <text x="55" y="18" fill="#525252" font-family="system-ui, sans-serif" font-size="9">User C</text>
  </g>
  
  <!-- Secure connection lines (maroon) -->
  <line x1="248" y1="145" x2="300" y2="81" stroke="#800000" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="248" y1="145" x2="308" y2="141" stroke="#800000" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  <line x1="248" y1="145" x2="300" y2="201" stroke="#800000" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.5"/>
  
  <!-- Blocked attack indicator -->
  <g transform="translate(35, 35)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#404040" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" fill="#404040" font-size="12" font-weight="bold">!</text>
  </g>
  <line x1="45" y1="40" x2="152" y2="105" stroke="#404040" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="100" y="70" fill="#404040" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">✗</text>
  
  <!-- Label -->
  <text x="200" y="268" text-anchor="middle" fill="#525252" font-family="system-ui, -apple-system, sans-serif" font-size="11">Privacy Protection</text>
</svg>