<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#525252"/>
      <stop offset="50%" style="stop-color:#404040"/>
      <stop offset="100%" style="stop-color:#262626"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#737373"/>
      <stop offset="50%" style="stop-color:#525252"/>
      <stop offset="100%" style="stop-color:#404040"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- Cloud layer (top) -->
  <g transform="translate(150, 20)" filter="url(#shadow)">
    <ellipse cx="50" cy="22" rx="50" ry="22" fill="white" stroke="#a3a3a3" stroke-width="1.5"/>
    <ellipse cx="28" cy="26" rx="28" ry="16" fill="white" stroke="#a3a3a3" stroke-width="1.5"/>
    <ellipse cx="75" cy="26" rx="32" ry="18" fill="white" stroke="#a3a3a3" stroke-width="1.5"/>
    <ellipse cx="50" cy="22" rx="50" ry="22" fill="white"/>
    <text x="50" y="28" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="11" font-weight="500">CLOUD</text>
  </g>
  
  <!-- Edge servers (middle layer) -->
  <g transform="translate(45, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="65" height="38" rx="4" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="5" y="5" width="55" height="7" rx="1" fill="#262626"/>
    <circle cx="10" cy="8.5" r="2" fill="#800000"/>
    <circle cx="17" cy="8.5" r="2" fill="#737373"/>
    <rect x="5" y="16" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="21" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="26" width="55" height="2.5" fill="#e5e5e5"/>
    <text x="32" y="48" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9">Edge</text>
  </g>
  
  <g transform="translate(167, 85)" filter="url(#shadow)">
    <rect x="0" y="0" width="65" height="38" rx="4" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="5" y="5" width="55" height="7" rx="1" fill="#262626"/>
    <circle cx="10" cy="8.5" r="2" fill="#800000"/>
    <circle cx="17" cy="8.5" r="2" fill="#737373"/>
    <rect x="5" y="16" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="21" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="26" width="55" height="2.5" fill="#e5e5e5"/>
    <text x="32" y="48" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9">Edge</text>
  </g>
  
  <g transform="translate(290, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="65" height="38" rx="4" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="5" y="5" width="55" height="7" rx="1" fill="#262626"/>
    <circle cx="10" cy="8.5" r="2" fill="#800000"/>
    <circle cx="17" cy="8.5" r="2" fill="#737373"/>
    <rect x="5" y="16" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="21" width="55" height="2.5" fill="#e5e5e5"/>
    <rect x="5" y="26" width="55" height="2.5" fill="#e5e5e5"/>
    <text x="32" y="48" text-anchor="middle" fill="#525252" font-family="system-ui, sans-serif" font-size="9">Edge</text>
  </g>
  
  <!-- Connections Cloud to Edge -->
  <line x1="200" y1="48" x2="77" y2="90" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="48" x2="200" y2="85" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="48" x2="322" y2="90" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Central Circuit Board -->
  <g transform="translate(115, 165)" filter="url(#shadow)">
    <!-- PCB Board -->
    <rect x="0" y="0" width="170" height="95" rx="6" fill="url(#boardGrad)"/>
    <!-- PCB Traces -->
    <g stroke="#737373" stroke-width="1" opacity="0.5">
      <path d="M 12,18 L 40,18 L 40,45"/>
      <path d="M 12,50 L 30,50 L 30,75"/>
      <path d="M 158,25 L 130,25 L 130,55"/>
      <path d="M 158,65 L 140,65 L 140,40"/>
      <path d="M 85,8 L 85,28"/>
      <path d="M 85,67 L 85,87"/>
    </g>
    <!-- Main Chip (NPU) -->
    <rect x="55" y="32" width="60" height="38" rx="3" fill="url(#chipGrad)" stroke="#262626" stroke-width="1"/>
    <rect x="60" y="37" width="50" height="28" fill="#1a1a1a"/>
    <!-- Chip pins -->
    <g fill="#a3a3a3">
      <rect x="62" y="26" width="4" height="6"/>
      <rect x="72" y="26" width="4" height="6"/>
      <rect x="82" y="26" width="4" height="6"/>
      <rect x="92" y="26" width="4" height="6"/>
      <rect x="102" y="26" width="4" height="6"/>
      <rect x="62" y="70" width="4" height="6"/>
      <rect x="72" y="70" width="4" height="6"/>
      <rect x="82" y="70" width="4" height="6"/>
      <rect x="92" y="70" width="4" height="6"/>
      <rect x="102" y="70" width="4" height="6"/>
    </g>
    <!-- Neural network inside chip (maroon accent) -->
    <g>
      <circle cx="70" cy="46" r="3" fill="#800000"/>
      <circle cx="70" cy="56" r="3" fill="#800000"/>
      <circle cx="85" cy="43" r="3" fill="#a3a3a3"/>
      <circle cx="85" cy="51" r="3" fill="#a3a3a3"/>
      <circle cx="85" cy="59" r="3" fill="#a3a3a3"/>
      <circle cx="100" cy="51" r="3" fill="#800000"/>
      <!-- Connections -->
      <g stroke="#d4d4d4" stroke-width="0.75" opacity="0.8">
        <line x1="73" y1="46" x2="82" y2="43"/>
        <line x1="73" y1="46" x2="82" y2="51"/>
        <line x1="73" y1="56" x2="82" y2="51"/>
        <line x1="73" y1="56" x2="82" y2="59"/>
        <line x1="88" y1="43" x2="97" y2="51"/>
        <line x1="88" y1="51" x2="97" y2="51"/>
        <line x1="88" y1="59" x2="97" y2="51"/>
      </g>
    </g>
    <!-- Other components -->
    <rect x="14" y="14" width="24" height="16" rx="2" fill="#262626"/>
    <circle cx="26" cy="22" r="4" fill="#404040" stroke="#525252"/>
    <rect x="132" y="14" width="24" height="16" rx="2" fill="#262626"/>
    <rect x="14" y="62" width="28" height="18" rx="2" fill="#404040"/>
    <rect x="128" y="62" width="28" height="18" rx="2" fill="#404040"/>
    <!-- LEDs (maroon accent) -->
    <circle cx="150" cy="48" r="4" fill="#800000"/>
    <circle cx="20" cy="48" r="4" fill="#737373"/>
  </g>
  
  <!-- Connections Edge to Device -->
  <line x1="77" y1="133" x2="150" y2="165" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  <line x1="200" y1="133" x2="200" y2="165" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  <line x1="322" y1="133" x2="250" y2="165" stroke="#a3a3a3" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Label -->
  <text x="200" y="280" text-anchor="middle" fill="#525252" font-family="system-ui, -apple-system, sans-serif" font-size="11">On-Device Intelligence</text>
</svg>