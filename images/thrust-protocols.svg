<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e5e5"/>
      <stop offset="50%" style="stop-color:#a3a3a3"/>
      <stop offset="100%" style="stop-color:#737373"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#fafafa"/>
  
  <!-- Circular pattern background -->
  <g opacity="0.08" stroke="#404040" stroke-width="1">
    <circle cx="200" cy="150" r="45" fill="none"/>
    <circle cx="200" cy="150" r="70" fill="none"/>
    <circle cx="200" cy="150" r="95" fill="none"/>
    <circle cx="200" cy="150" r="120" fill="none"/>
  </g>
  
  <!-- Protocol Blocks (corners) -->
  <!-- MAC Layer -->
  <g transform="translate(28, 38)" filter="url(#shadow)">
    <rect x="0" y="0" width="75" height="48" rx="6" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="0" y="0" width="75" height="48" rx="6" fill="#800000" opacity="0.08"/>
    <text x="37" y="26" text-anchor="middle" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">MAC</text>
    <text x="37" y="40" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="9">Layer</text>
  </g>
  
  <!-- PHY Layer -->
  <g transform="translate(297, 38)" filter="url(#shadow)">
    <rect x="0" y="0" width="75" height="48" rx="6" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="0" y="0" width="75" height="48" rx="6" fill="#404040" opacity="0.08"/>
    <text x="37" y="26" text-anchor="middle" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PHY</text>
    <text x="37" y="40" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="9">Layer</text>
  </g>
  
  <!-- NET Layer -->
  <g transform="translate(28, 214)" filter="url(#shadow)">
    <rect x="0" y="0" width="75" height="48" rx="6" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="0" y="0" width="75" height="48" rx="6" fill="#525252" opacity="0.08"/>
    <text x="37" y="26" text-anchor="middle" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">NET</text>
    <text x="37" y="40" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="9">Layer</text>
  </g>
  
  <!-- APP Layer -->
  <g transform="translate(297, 214)" filter="url(#shadow)">
    <rect x="0" y="0" width="75" height="48" rx="6" fill="white" stroke="#525252" stroke-width="1.5"/>
    <rect x="0" y="0" width="75" height="48" rx="6" fill="#737373" opacity="0.08"/>
    <text x="37" y="26" text-anchor="middle" fill="#262626" font-family="system-ui, sans-serif" font-size="14" font-weight="600">APP</text>
    <text x="37" y="40" text-anchor="middle" fill="#737373" font-family="system-ui, sans-serif" font-size="9">Layer</text>
  </g>
  
  <!-- Central RL Brain -->
  <g transform="translate(200, 150)" filter="url(#shadow)">
    <!-- Outer glow -->
    <circle cx="0" cy="0" r="48" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="1"/>
    <!-- Main brain circle -->
    <circle cx="0" cy="0" r="40" fill="url(#brainGrad)" stroke="#525252" stroke-width="1.5"/>
    <!-- Brain wrinkle patterns -->
    <g fill="none" stroke="white" stroke-width="1.5" opacity="0.5">
      <path d="M -25,-12 Q -12,-20 0,-12 Q 12,-20 25,-12"/>
      <path d="M -22,0 Q -10,-8 4,0 Q 18,-8 22,0"/>
      <path d="M -25,12 Q -12,4 0,12 Q 12,4 25,12"/>
    </g>
    <!-- RL text (maroon) -->
    <text x="0" y="7" text-anchor="middle" fill="#800000" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">RL</text>
  </g>
  
  <!-- State-Action-Reward labels -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#737373" font-style="italic">
    <text x="200" y="90" text-anchor="middle">State</text>
    <text x="125" y="180" text-anchor="middle">Reward</text>
    <text x="275" y="180" text-anchor="middle">Action</text>
  </g>
  
  <!-- Curved cycle arrows (maroon) -->
  <g fill="none" stroke="#800000" stroke-width="1.5" opacity="0.5">
    <path d="M 218,100 Q 250,108 255,140"/>
    <path d="M 245,170 Q 225,190 175,178"/>
    <path d="M 145,165 Q 125,140 175,105"/>
  </g>
  
  <!-- Connection lines from brain to protocol blocks -->
  <g stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.4">
    <line x1="165" y1="120" x2="103" y2="82"/>
    <line x1="235" y1="120" x2="297" y2="82"/>
    <line x1="165" y1="180" x2="103" y2="218"/>
    <line x1="235" y1="180" x2="297" y2="218"/>
  </g>
  
  <!-- Neural pathway indicators (maroon accent) -->
  <g>
    <circle cx="140" cy="118" r="4" fill="#800000" opacity="0.6"/>
    <circle cx="260" cy="118" r="4" fill="#737373"/>
    <circle cx="140" cy="182" r="4" fill="#737373"/>
    <circle cx="260" cy="182" r="4" fill="#800000" opacity="0.6"/>
  </g>
  
  <!-- Label -->
  <text x="200" y="285" text-anchor="middle" fill="#525252" font-family="system-ui, -apple-system, sans-serif" font-size="11">Self-Driving Protocol Design</text>
</svg>